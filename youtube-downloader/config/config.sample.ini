[Defaults]
# The default folder where all downloads will be saved.
download_directory = D:/MyVideos/YouTube

# Default video resolution to aim for (e.g., 1080, 720).
default_resolution = 1080p

# Whether to embed subtitles into the video file by default.
# Options: true, false
embed_subtitles = true

# A comma-separated list of preferred subtitle language codes (e.g., en,es,fr).
subtitle_languages = en,es

[Proxy]
# Optional: Configure proxies if needed. Leave blank if not used.
# Example: http://user:pass@127.0.0.1:8080
http_proxy = 
https_proxy = 
socks5_proxy =