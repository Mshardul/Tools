name: python-clis
on:
  push:
    paths:
      - 'cli/**'
      - 'apps/**'
      - 'extensions/**'
      - 'pyproject.toml'
      - '.github/workflows/python-clis.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'cli/**'
      - 'apps/**'
      - 'extensions/**'
      - 'pyproject.toml'
      - '.github/workflows/python-clis.yml'
      - '.github/scripts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.16.5 check .
      - run: uvx ruff@0.16.5 format --check .

  matrix-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/tests/test_py_test_matrix.sh

  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.set.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
            head="HEAD"
          else
            base="$EVENT_BEFORE"
            head="$HEAD_SHA"
          fi
          # New branch / forced push: base may not resolve, fall back to run-all.
          if ! git cat-file -e "$base" 2>/dev/null; then
            base=""
            head="HEAD"
          fi
          dirs="$(.github/scripts/py-test-matrix.sh "$base" "$head")"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install leaf deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
      - run: pytest
