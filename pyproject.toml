# Repo-wide Python tooling. Swift app apps/media-grabber/ has its own config.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["archive", ".venv", "downloads"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    # Groups below are enabled one rollout step at a time, violations fixed in the same commit.
    # "UP",   # step 2: pyupgrade
    # "B",    # step 3: flake8-bugbear
    # "SIM",  # step 4: flake8-simplify
    # "PTH",  # step 4: flake8-use-pathlib
    # "RUF",  # step 5: ruff-specific
    # "DTZ",  # step 5: flake8-datetimez
    # "TRY",  # step 5: tryceratops
    # "PLW",  # step 5: pylint warnings
    # "EXE",  # step 5: flake8-executable
]

[tool.ruff.format]
# defaults

[tool.pytest.ini_options]
# Leaves are run from their own dir (CI does `cd <leaf> && pytest`); no repo-wide discovery.
addopts = "-q"
