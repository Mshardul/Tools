# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      # Hooks below are enabled one rollout step at a time, matching pyproject.toml select.
      # - id: trailing-whitespace   # step 2
      # - id: end-of-file-fixer     # step 2
      # - id: check-merge-conflict  # step 2
      # - id: mixed-line-ending     # step 3
